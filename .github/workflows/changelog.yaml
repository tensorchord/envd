name: changelog

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  generate_changelog:
    runs-on: ubuntu-latest
    name: Generate changelog
    permissions:
      contents: write        # push the changelog branch
      pull-requests: write   # open the update PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --prune --prune-tags
      - run: git tag -l 'v*'
      - run: ./hack/changelog.sh > CHANGELOG.md
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: 'docs: updated CHANGELOG.md'
          commit-message: 'docs: updated CHANGELOG.md'
          branch: create-pull-request/changelog
          signoff: true
